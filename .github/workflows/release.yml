name: Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release tag (for example v1.0.0)
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}
          build-args: SERVICE_VERSION=${{ github.sha }}

  migrate-and-deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
      ROLLBACK_HOOK_URL: ${{ secrets.ROLLBACK_HOOK_URL }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      BACKUP_RESTORE_TESTED_AT: ${{ vars.BACKUP_RESTORE_TESTED_AT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require operations prerequisites
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$DEPLOY_HOOK_URL"
          test -n "$ROLLBACK_HOOK_URL"
          test -n "$PUBLIC_BASE_URL"
          test -n "$BACKUP_RESTORE_TESTED_AT"
      - name: Apply forward-only migrations once
        run: npm run migrate:up
      - name: Deploy immutable image
        shell: bash
        run: curl --fail --silent --show-error --retry 3 -X POST -H "X-Release-Image:${{ needs.publish.outputs.image }}" "$DEPLOY_HOOK_URL"
      - name: Verify readiness or trigger application rollback
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 "$PUBLIC_BASE_URL/health/ready" > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          curl --fail --silent --show-error --retry 3 -X POST "$ROLLBACK_HOOK_URL"
          exit 1
