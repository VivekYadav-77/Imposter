name: Android signed release candidate

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Play version code
        required: true
        type: string
      version_name:
        description: Semantic release version (for example 1.0.0)
        required: true
        type: string
      production_api_base_url:
        description: Approved HTTPS production API origin without a trailing slash
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.version_name }}
  cancel-in-progress: false

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-production
    env:
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      PRODUCTION_API_BASE_URL: ${{ inputs.production_api_base_url }}
      ANDROID_ACCOUNT_FEATURE_ENABLED: "true"
      GOOGLE_WEB_CLIENT_ID: 120811442981-ki3m1am77h0m9dujmqsiv71l2vrgf43p.apps.googleusercontent.com
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    defaults:
      run:
        working-directory: android app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Materialize signing key outside the checkout
        shell: bash
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          keystore_path="$RUNNER_TEMP/android-production.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$keystore_path" >> "$GITHUB_ENV"
      - name: Run release checks twice from clean outputs
        run: |
          ./gradlew --no-daemon --stacktrace clean quality bundleRelease assembleRelease
          ./gradlew --no-daemon --stacktrace clean quality bundleRelease assembleRelease
      - name: Prepare stable APK download name
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/imposter-game.apk
      - name: Upload signed candidate and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: imposter-game-android-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: |
            android app/app/build/outputs/apk/release/imposter-game.apk
            android app/app/build/outputs/bundle/release/*.aab
            android app/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error
      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version_name }}
          name: Imposter Game v${{ inputs.version_name }}
          body: |
            Signed Android release for Imposter Game v${{ inputs.version_name }}.

            Download `imposter-game.apk` below to install the app on Android 8.0 or newer.
          files: android app/app/build/outputs/apk/release/imposter-game.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
