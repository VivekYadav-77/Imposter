name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: imposter_game_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imposter_game_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/imposter_game_test
      TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/imposter_game_test
      APP_ENV: test
      EXPOSE_API_DOCS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run migrate:verify
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
