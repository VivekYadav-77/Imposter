name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imposter_game_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/imposter_game_test
      APP_ENV: test
      EXPOSE_API_DOCS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb imposter_game_test
      - run: npm ci
      - run: npm run migrate:verify
      - run: npm run check
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
