<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Imposter Game</title>
  <desc id="desc">A dark signal-room inspired banner for the Imposter Game monorepo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b18"/>
      <stop offset="1" stop-color="#0d100e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f4f0e6" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="186" cy="180" r="155" fill="url(#glow)"/>
  <path d="M0 296C180 250 305 336 492 278S838 210 1200 286" fill="none" stroke="#f59e0b" stroke-opacity=".3" stroke-width="2"/>
  <path d="M0 317C190 278 345 344 536 304S888 238 1200 310" fill="none" stroke="#f4f0e6" stroke-opacity=".1"/>
  <g transform="translate(78 72)" filter="url(#shadow)">
    <rect width="216" height="216" rx="54" fill="#191d1a" stroke="#f4f0e6" stroke-opacity=".14"/>
    <circle cx="108" cy="108" r="81" fill="none" stroke="#f4f0e6" stroke-width="8"/>
    <path d="M51 108s23-36 57-36 57 36 57 36-23 36-57 36-57-36-57-36Z" fill="none" stroke="#f4f0e6" stroke-linecap="round" stroke-linejoin="round" stroke-width="10"/>
    <circle cx="108" cy="108" r="16" fill="#f59e0b"/>
    <path d="m161 49 24-24" stroke="#f59e0b" stroke-linecap="round" stroke-width="12"/>
  </g>
  <g fill="#f4f0e6">
    <text x="350" y="150" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#f59e0b">TRUST IS THE GAME</text>
    <text x="346" y="221" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="900" letter-spacing="-2">IMPOSTER GAME</text>
    <text x="350" y="266" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500" opacity=".72">One room. Two clients. Every decision server-authoritative.</text>
  </g>
  <g transform="translate(1015 62)" fill="none" stroke="#f59e0b" stroke-linecap="round">
    <path d="M0 28h78M18 0v56M42 12v32M64 5v46" stroke-opacity=".62"/>
    <circle cx="18" cy="18" r="5" fill="#f59e0b" stroke="none"/>
    <circle cx="42" cy="34" r="5" fill="#f59e0b" stroke="none"/>
    <circle cx="64" cy="14" r="5" fill="#f59e0b" stroke="none"/>
  </g>
</svg>
